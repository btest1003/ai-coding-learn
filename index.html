<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Learn" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>AI Coding Learn</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI CODING LEARN</p>
        <h1>1日5分で、AI開発の基礎。</h1>
      </div>
      <button id="resetBtn" class="ghost-button" type="button">リセット</button>
    </header>

    <section class="progress-card">
      <div class="progress-row">
        <div>
          <span class="label">学習進捗</span>
          <strong id="progressText">0 / 8</strong>
        </div>
        <span id="streakBadge" class="badge">START</span>
      </div>
      <div class="progress-track" aria-label="学習進捗">
        <div id="progressBar" class="progress-fill"></div>
      </div>
      <p id="progressHint" class="muted">まずは Model から。</p>
    </section>

    <section id="lessonView" class="lesson-card" aria-live="polite">
      <div class="lesson-meta">
        <span id="lessonStep" class="pill">1 / 8</span>
        <span id="lessonLevel" class="muted">LEVEL 1</span>
      </div>
      <h2 id="lessonTerm">Model</h2>
      <p id="lessonSummary" class="summary"></p>
      <div id="lessonDiagram" class="diagram"></div>
      <div class="info-block">
        <span class="label">身近な例</span>
        <p id="lessonExample"></p>
      </div>
      <div class="info-block">
        <span class="label">なぜ重要？</span>
        <p id="lessonWhy"></p>
      </div>
      <button id="quizBtn" class="primary-button" type="button">1問だけ解く</button>
    </section>

    <section id="quizView" class="quiz-card hidden" aria-live="polite">
      <div class="lesson-meta">
        <span class="pill">QUIZ</span>
        <span id="quizTerm" class="muted"></span>
      </div>
      <h2 id="quizQuestion"></h2>
      <div id="quizChoices" class="choices"></div>
      <p id="quizFeedback" class="feedback"></p>
      <button id="nextBtn" class="primary-button hidden" type="button">次へ</button>
    </section>

    <section class="map-card">
      <div class="section-title-row">
        <div>
          <span class="label">概念マップ</span>
          <h3>今どこを学んでいるか</h3>
        </div>
      </div>
      <div id="conceptMap" class="concept-map"></div>
    </section>

    <footer class="site-footer">
      <p>Independent educational project. Inspired in part by <a href="https://github.com/mattpocock/dictionary-of-ai-coding" target="_blank" rel="noreferrer">Dictionary of AI Coding</a>. This is not an official translation.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
